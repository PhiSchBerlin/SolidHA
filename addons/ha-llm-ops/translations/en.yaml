configuration:
  log_level:
    name: Log level
    description: Logging verbosity
  buffer_size:
    name: Buffer size
    description: Number of log lines to retain
  analysis_rate_seconds:
    name: Analysis rate seconds
    description: Minimum seconds between analyses
  analysis_max_lines:
    name: Analysis max lines
    description: Maximum lines of context sent to LLM
  openai_api_key:
    name: OpenAI API key
    description: API key used for OpenAI analysis
  llm_provider:
    name: LLM provider
    description: LLM provider to use (openai, requesty, compatible, mock)
  llm_base_url:
    name: LLM base URL
    description: Base URL for the LLM API (e.g. https://router.requesty.ai/v1)
  llm_model:
    name: LLM model
    description: Model name used by the LLM provider
  llm_api_key:
    name: LLM API key
    description: API key for the LLM provider
  llm_backup_provider:
    name: Backup LLM provider
    description: Backup LLM provider used when the primary is rate-limited
  llm_backup_base_url:
    name: Backup LLM base URL
    description: Base URL for the backup LLM API
  llm_backup_model:
    name: Backup LLM model
    description: Model name used by the backup LLM provider
  llm_backup_api_key:
    name: Backup LLM API key
    description: API key for the backup LLM provider
  llm_http_referer:
    name: LLM HTTP Referer
    description: Optional HTTP Referer header for analytics (e.g. https://yourapp.com)
  llm_x_title:
    name: LLM X-Title
    description: Optional X-Title header for analytics (e.g. My App)
