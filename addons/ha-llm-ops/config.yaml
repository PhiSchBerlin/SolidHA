name: HA LLM Ops
version: 0.0.63
slug: ha_llm_ops
description: LLM-powered add-on that analyzes Home Assistant problems and suggests safe fixes.
arch:
  - aarch64
  - amd64
startup: application
boot: auto
homeassistant_api: true
ingress: true
ingress_port: 8000
panel_icon: mdi:robot
panel_title: Autofix Problems
options:
  log_level: info
  buffer_size: 10
  analysis_rate_seconds: 60
  analysis_max_lines: 20
  openai_api_key: ""
  llm_provider: openai
  llm_base_url: "https://router.requesty.ai/v1"
  llm_model: nvidia/nemotron-3-super-120b-a12b
  llm_api_key: ""
  llm_backup_provider: mock
  llm_backup_base_url: ""
  llm_backup_model: ""
  llm_backup_api_key: ""
schema:
  log_level: list(debug|info|warning|error)?
  buffer_size: int
  analysis_rate_seconds: int?
  analysis_max_lines: int?
  openai_api_key: password?
  llm_provider: list(openai|requesty|compatible|mock)?
  llm_base_url: str?
  llm_model: str?
  llm_api_key: password?
  llm_backup_provider: list(openai|requesty|compatible|mock)?
  llm_backup_base_url: str?
  llm_backup_model: str?
  llm_backup_api_key: password?
icon: addons/ha-llm-ops/icon.png
logo: addons/ha-llm-ops/icon.png
